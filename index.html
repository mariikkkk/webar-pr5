<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задание 5 — Three.js</title>
  <script type="importmap">
    {"imports": {"three": "./vendor/three.module.js", "three/addons/": "./vendor/"}}
  </script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #overlay { position: fixed; inset: 0; pointer-events: none; }
    #status { margin: 0; padding: 8px; background: white; }
    #panel { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px; background: white; border-top: 1px solid black; pointer-events: auto; }
    #panel p { margin: 4px 0; }
    button, select { min-height: 36px; vertical-align: middle; }
    :xr-overlay { background: transparent; }
  </style>
</head>
<body>
  <div id="overlay">
    <p id="status" role="status">Загрузка сцены…</p>
    <div id="panel">
      <p>
        <label>Форма:
          <select id="model">
            <option value="cube">Куб</option>
            <option value="sphere">Сфера</option>
            <option value="torus">Тор</option>
          </select>
        </label>
        <label>Цвет:
          <select id="color">
            <option value="#2196f3">Синий</option>
            <option value="#f44336">Красный</option>
            <option value="#4caf50">Зелёный</option>
            <option value="#ffeb3b">Жёлтый</option>
          </select>
        </label>
      </p>
      <p>
        <button id="left">−15°</button>
        <button id="right">+15°</button>
        <button id="spin" aria-pressed="false">Автовращение</button>
        <button id="reset">Сброс</button>
      </p>
      <p>
        <button id="start" disabled>Проверка AR…</button>
        <button id="place" hidden>Передо мной</button>
        <button id="exit" hidden>Выйти из AR</button>
      </p>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
